# Synology replacement downloader. Existing qbittorrent remains independent.
services:
  vpn:
    image: qmcgaw/gluetun@sha256:4af0c804003481e100180e1f8d4d5e9c48163fedc0f88d061881b615aef9d183
    container_name: homelab-v2-vpn
    hostname: homelab-v2-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: nordvpn
      VPN_TYPE: openvpn
      OPENVPN_PROTOCOL: udp
      SERVER_COUNTRIES: United States
      SERVER_HOSTNAMES: us13409.nordvpn.com
      TZ: ${TZ:?See env.example for default.}
      FIREWALL_INPUT_PORTS: "8082"
      HTTP_CONTROL_SERVER_ADDRESS: 127.0.0.1:8000
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/gluetun/data:/gluetun
      - ${DOCKER_DATA_DIR:?See env.example for default.}/gluetun/auth:/gluetun/auth:ro
    ports:
      - "${NAS_LAN_IP:?See env.example for default.}:8082:8082"
    networks:
      - homelab
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    secrets:
      - openvpn_user
      - openvpn_password
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent@sha256:05c1454f9a32967affc1f34f67f8cc0cc57dd805dca45489fe797095a6286556
    container_name: homelab-v2-qbittorrent
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: ${PUID:?See env.example for default.}
      PGID: ${PGID:?See env.example for default.}
      TZ: ${TZ:?See env.example for default.}
      WEBUI_PORT: "8082"
      TORRENTING_PORT: "6881"
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/qbittorrent/data/config:/config
      - ${DOWNLOADS_DIR:?See env.example for default.}:/downloads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
networks:
  homelab:
    external: true
    name: homelab-v2-jellyfin_homelab
secrets:
  openvpn_user:
    file: ${DOCKER_DATA_DIR:?See env.example for default.}/gluetun/secrets/openvpn_user
  openvpn_password:
    file: ${DOCKER_DATA_DIR:?See env.example for default.}/gluetun/secrets/openvpn_password
