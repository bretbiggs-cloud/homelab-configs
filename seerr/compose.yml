services:
  seerr:
    image: ghcr.io/seerr-team/seerr@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be
    container_name: homelab-v2-seerr
    hostname: homelab-v2-seerr
    user: "${PUID:?See env.example for default.}:${PGID:?See env.example for default.}"
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:?See env.example for default.}
      LOG_LEVEL: info
      PORT: "5055"
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/seerr/data:/app/config
    ports:
      - "${NAS_LAN_IP:?See env.example for default.}:5056:5055"
    networks:
      - homelab
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5055/api/v1/settings/public"]
      start_period: 90s
      timeout: 10s
      interval: 60s
      retries: 3
networks:
  homelab:
    external: true
    name: homelab-v2-jellyfin_homelab
