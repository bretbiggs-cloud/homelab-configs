# Synology production Jellyfin. LAN 8097; Tailscale forwards 8096. Media read-only.
services:
  jellyfin:
    image: jellyfin/jellyfin@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    container_name: homelab-v2-jellyfin
    hostname: homelab-v2-jellyfin
    user: "${PUID:?See env.example for default.}:${PGID:?See env.example for default.}"
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:?See env.example for default.}
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/jellyfin/data/config:/config
      - ${DOCKER_DATA_DIR:?See env.example for default.}/jellyfin/data/cache:/cache
      - ${MEDIA_DIR:?See env.example for default.}:/media:ro
    ports:
      - "${NAS_LAN_IP:?See env.example for default.}:${JELLYFIN_HTTP_PORT:?See env.example for default.}:8096"
    networks:
      - homelab
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  homelab:
    driver: bridge
