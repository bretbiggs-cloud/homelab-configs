# ==============================================================================
# Stack: Dedicated Tailscale PIA Exit Node (vpn-bridge/compose.yml)
#
# Purpose:
#   Provides a dedicated, secure exit node on your Tailnet. Remote Tailscale
#   client devices (phones, laptops) can route their public internet traffic
#   through Private Internet Access (PIA) to prevent public ISP IP leaks on
#   untrusted networks, while retaining direct LAN access to homelab services
#   via the primary 'tailscale' subnet router.
#
# Architecture:
#   Co-locates the PIA WireGuard tunnel client and Tailscale daemon inside
#   the exact same Docker network namespace ('network_mode: "service:vpn"'):
#     1. 'vpn' (thrnz/docker-wireguard-pia):
#        Establishes a WireGuard tunnel (wg0) to a domestic US PIA endpoint,
#        enforces an iptables kill switch, enables IPv4 transit forwarding, and
#        masquerades traffic arriving from 'tailscale0' out through 'wg0'.
#     2. 'tailscale' (tailscale/tailscale):
#        Attaches to the WireGuard container's network namespace, joins the
#        Tailnet as 'vpn-bridge', and advertises itself as a Tailscale exit node
#        ('--advertise-exit-node').
# ==============================================================================

services:
  vpn:
    image: thrnz/docker-wireguard-pia:latest
    container_name: vpn-bridge-pia
    hostname: vpn-bridge
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    environment:
      USER: ${VPN_USER:?See env.example for default.}
      PASS: ${VPN_PASS:?See env.example for default.}
      LOC: ${PIA_REGION:?See env.example for default.}
      PORT_FORWARDING: 0
      FIREWALL: 1
      FWD_IFACE: tailscale+
      LOCAL_NETWORK: 192.168.0.0/16
      VPNDNS: 9.9.9.9,149.112.112.112
      # By default, Tailscale marks daemon packets with fwmark 0x80000 and routes them
      # to table 'main' (eth0), where PIA's firewall drops non-LAN WAN traffic.
      # Rule 5200 routes Tailscale's mark to PIA's WireGuard table (51820), allowing
      # the Tailscale daemon to reach controlplane and DERP servers through PIA.
      POST_UP: ip rule add fwmark 0x80000/0xff0000 table 51820 priority 5200 2>/dev/null || true
      POST_RECONNECT: ip rule add fwmark 0x80000/0xff0000 table 51820 priority 5200 2>/dev/null || true
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/vpn-bridge/data/pia:/pia
    networks:
      - homelab

  tailscale:
    image: tailscale/tailscale:latest
    container_name: vpn-bridge-tailscale
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: vpn-bridge
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: --advertise-exit-node --snat-subnet-routes=true --accept-dns=false --netfilter-mode=off
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/vpn-bridge/data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    tmpfs:
      - /tmp
    labels:
      - homepage.group=Network
      - homepage.name=VPN Bridge Exit Node
      - homepage.icon=tailscale
      - homepage.href=https://login.tailscale.com/admin/machines
      - homepage.description=Tailscale Exit Node routed through PIA WireGuard

networks:
  homelab:
    external: true
