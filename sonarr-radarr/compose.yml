# ==============================================================================
# Stack: Media Automation Suite (sonarr-radarr/compose.yml)
#
# Services:
#   - radarr:       Movie collection manager (https://radarr.turing.home)
#   - sonarr:       TV series collection manager (https://sonarr.turing.home)
#   - prowlarr:     Indexer manager synced with Radarr/Sonarr (https://prowlarr.turing.home)
#   - flaresolverr: Headless browser proxy for Cloudflare-protected indexers
#
# UID/GID & Entrypoint Note:
#   LinuxServer.io images ('lscr.io/linuxserver/*') use s6-overlay, which starts
#   as root to initialize container permissions and then drops privileges to
#   PUID:PGID (1000:100). Do NOT set Compose 'user:' on these services.
# ==============================================================================

services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:?See env.example for default.}
      PGID: ${PGID:?See env.example for default.}
      TZ: ${TZ:?See env.example for default.}
      RADARR__AUTH__APIKEY: ${RADARR_API_KEY:?See env.example for default.}
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/radarr/data:/config
      - ${MEDIA_DIR:?See env.example for default.}:/media
    # ports:
    #   - 8040:7878
    networks:
      - homelab
    labels:
      - homepage.group=Downloads
      - homepage.name=Radarr
      - homepage.icon=radarr
      - homepage.href=http://radarr.turing.home
      - homepage.description=Movie Autodownloader
      - homepage.widget.type=radarr
      - homepage.widget.url=http://radarr:7878
      - homepage.widget.key=${RADARR_API_KEY:?See env.example for default.}
      - homepage.widget.enableQueue=true

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:?See env.example for default.}
      PGID: ${PGID:?See env.example for default.}
      TZ: ${TZ:?See env.example for default.}
      SONARR__AUTH__APIKEY: ${SONARR_API_KEY:?See env.example for default.}
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/sonarr/data:/config
      - ${MEDIA_DIR:?See env.example for default.}:/media
    # ports:
    #   - 8041:8989
    networks:
      - homelab
    labels:
      - homepage.group=Downloads
      - homepage.name=Sonarr
      - homepage.icon=sonarr
      - homepage.href=http://sonarr.turing.home
      - homepage.description=TV Autodownloader
      - homepage.widget.type=sonarr
      - homepage.widget.url=http://sonarr:8989
      - homepage.widget.key=${SONARR_API_KEY:?See env.example for default.}
      - homepage.widget.enableQueue=true

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    hostname: prowlarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:?See env.example for default.}
      PGID: ${PGID:?See env.example for default.}
      TZ: ${TZ:?See env.example for default.}
      PROWLARR__AUTH__APIKEY: ${PROWLARR_API_KEY:?See env.example for default.}
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/prowlarr/data:/config
    # ports:
    #   - 8042:9696
    networks:
      - homelab
    labels:
      - homepage.group=Infrastructure
      - homepage.name=Prowlarr
      - homepage.icon=prowlarr
      - homepage.href=http://prowlarr.turing.home
      - homepage.description=Indexer Management
      - homepage.widget.type=prowlarr
      - homepage.widget.url=http://prowlarr:9696
      - homepage.widget.key=${PROWLARR_API_KEY:?See env.example for default.}

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    hostname: flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: ${TZ:?See env.example for default.}
    # ports:
    #   - 8043:8191
    networks:
      - homelab
    labels:
      - homepage.group=Infrastructure
      - homepage.name=Flaresolverr
      - homepage.icon=flaresolverr
      - homepage.href=http://flaresolverr.turing.home
      - homepage.description=Cloudflare Bypass (degraded)

networks:
  homelab:
    external: true
