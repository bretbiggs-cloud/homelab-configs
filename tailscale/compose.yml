# Private application access, not a subnet router. No host network mutations.
services:
  tailscale:
    image: tailscale/tailscale@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    container_name: homelab-v2-tailscale
    hostname: substation
    user: "${PUID:?See env.example for default.}:${PGID:?See env.example for default.}"
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TS_HOSTNAME: substation
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /tmp/tailscaled.sock
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      # Allow time for interactive enrollment without rotating login links.
      TS_BOOT_TIMEOUT: 24h
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --accept-routes=false
    volumes:
      - ../.configs/tailscale:/config:ro
      - ${DOCKER_DATA_DIR:?See env.example for default.}/tailscale/data:/var/lib/tailscale
    networks:
      - homelab
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  homelab:
    external: true
    name: homelab-v2-jellyfin_homelab
